<!DOCTYPE html>
<html>

<head>
    <title>Warranty Request Page</title>
</head>

<body>
    <h1>Warranty Request Page</h1>
    {% if error_msg %}
    <p>
        <b>{{ error_msg }}</b>
    </p>
    {% endif %}

    <form action="{{url_for('warranty')}}" method="POST">
        <p>
            Please enter the Serial No of your product:
        </p>
        <p>
            <input type="text" name="serial_no">
        </p>
        <p>
            <input type="submit">
        </p>
    </form>
</body>

</html>
