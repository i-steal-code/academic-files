<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Search</title>
	<style>
		body {
			background-color: #2F8A7B;
			color: white;
			font-family: Arial;
		}

		table {
			margin: 0 auto;
			width: 80%;
		}

		th, td {
			border: 1px solid orange;
			text-align: center;
		}
		
		th {
			background-color: black;
		}

		tr.header{

		}
	</style>
</head>

<body>
	<h1>Search latecoming records</h1>
	<form method="POST">
		<label for="name">Name: </label>
		<input type="text" id="name" name="name" required>
		<input type="submit" value="Search">
	</form>
	
	{% if records %}
		<h2>{{ name }}</h2>
		<p>Latecoming count: {{ records | length }}</p>
		<table>
			<tr class="header">
				<th>Date</th>
				<th>Reason</th>
			</tr>
			{% for record in records %}
				<tr>
					<td>{{ record[0] }}</td>
					<td>{{ record[1] }}</td>
				</tr>
			{% endfor %}
		</table>
	{% else %}
		{% if name %}
			<p>There are no latecoming records found for {{ name }}.</p>
		{% endif %}
	{% endif %}
</body>

</html>
