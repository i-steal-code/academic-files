<!doctype html>
<html>
<head>
<title>attendance results</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
<h1>results</h1>
<p>session: {{ session_type }} · name filter: {{ member_name }}</p>
<ul>
{% for row in rows %}
<li>{{ row["name"] }} — {{ row["date"] }} — {{ row["session"] }} ({{ row["house"] }})</li>
{% else %}
<li>no matching rows</li>
{% endfor %}
</ul>
<p><a href="{{ url_for('portal') }}">back</a></p>
</div>
</body>
</html>
