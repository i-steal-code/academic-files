<!doctype html>
<html>
<head>
<title>club hits</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
<h1>hits</h1>
<p>{{ q_session }} · {{ q_name }}</p>
<ul>
{% for row in rows %}
<li>{{ row["name"] }} — {{ row["date"] }} — {{ row["session"] }}</li>
{% else %}
<li>none</li>
{% endfor %}
</ul>
<p><a href="{{ url_for('front') }}">back</a></p>
</div>
</body>
</html>
