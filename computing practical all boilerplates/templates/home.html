<!doctype html>
<html>
<head>
<title> web app title </title>
<link rel='stylesheet' href="{{url_for('static', filename='style.css')}}">
</head>
<body>
<div class='container'>
<h1> header 1: latecoming search </h1>
<!-- error handling: server-side error occured -->
{% if error %}
<p> {{error}} </p>
{% endif%}
<!-- 
form sending POST request to home function through '/' route
request.form has 'category' key and 'name' key that 
point to the entries in the form and can be accessed in app.py
-->
<form method='POST' action='/'>
<label> Reason for latecoming: </label>
<select name='category'>
<option value='medical'> medical </option>
<option value='family'> family </option>
<option value='other'> other </option>
<option value='Heavy traffic'> Heavy traffic </option>
</select>

<label> student name: </label>
<input type='text' name='name'> 
<input type='submit' value='submit'>
</form>
</div>
</body>
</html>
